    <script>
      // Ensure window.fetch is safely configurable if injected scripts attempt to wrap or polyfill it
      try {
        const originalFetch = window.fetch;
        if (originalFetch) {
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        console.debug('Fetch descriptor initialization handled:', e);
      }
    </script>
